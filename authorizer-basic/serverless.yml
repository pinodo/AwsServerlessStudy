service: authorizer-basic

provider:
  name: aws
  runtime: java21
  region: ap-northeast-2
  memorySize: 2048
  timeout: 20
  architecture: x86_64
  httpApi:
    # HTTP API v2 전용 Lambda Custom Authorizer 설정
    authorizers:
      LoungeCustomAuthorizer:
        type: request
        # Authorizer 역할을 수행할 Lambda 함수 연결
        functionName: loungeAuthorizer
        # Simple Authorizer Response 규격(isAuthorized, context 맵 반환 방식) 사용 선언
        enableSimpleResponses: true
        payloadVersion: '2.0'
        identitySource:
          - $request.header.Authorization

package:
  artifact: build/libs/authorizer-basic-0.0.1-SNAPSHOT.jar

functions:
  # Authorizer Lambda 함수 정의
  loungeAuthorizer:
    handler: com.example.lounge.LoungeAuthorizerHandler::handleRequest
    snapStart: true

  # 메인 라운지 API Lambda 함수 정의 및 Authorizer 연동
  getLounge:
    handler: com.example.lounge.LoungeHandler::handleRequest
    snapStart: true
    events:
      - httpApi:
          method: GET
          path: /api/lounge
          # 위에서 정의한 LoungeCustomAuthorizer 적용
          authorizer:
            name: LoungeCustomAuthorizer

outputs:
  ApiEndpoint:
    Description: "Lounge API Gateway Base URL"
    Value:
      Fn::Sub: "https://${SLSHttpApi}.execute-api.${AWS::Region}.amazonaws.com"