service: dynamodb-gsi

provider:
  name: aws
  runtime: java21
  region: ap-northeast-2
  architecture: x86_64
  memorySize: 2048
  timeout: 20
  environment:
    TABLE_NAME: ${self:custom.tableName}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - !GetAtt UserTable.Arn
            # IAM 권한에 GSI 인덱스 ARN 추가 필요
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${self:custom.tableName}/index/*"

custom:
  # 본인 이름으로 변경
  userName: sesac-b2
  tableName: user-gsi-table-${self:custom.userName}

package:
  artifact: build/libs/dynamodb-gsi-sesac-b2-0.0.1-SNAPSHOT.jar

functions:
  userHandler:
    handler: com.example.user.controller.UserHandler::handleRequest
    snapStart: true
    events:
      - httpApi:
          path: /api/users
          method: post
      - httpApi:
          path: /api/users/{userId}
          method: get
      - httpApi:
          path: /api/users/email/{email}
          method: get
      - httpApi:
          path: /api/users/role/{role}
          method: get

resources:
  Resources:
    UserTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tableName}
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: email
            AttributeType: S
          - AttributeName: role
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        GlobalSecondaryIndexes:
          # [GSI 1] 이메일 단건 조회용 인덱스
          - IndexName: EmailIndex
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          # [GSI 2] Role별 목록 조회용 인덱스 (createdAt으로 정렬)
          - IndexName: RoleIndex
            KeySchema:
              - AttributeName: role
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL