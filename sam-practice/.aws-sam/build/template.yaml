AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM practice project for user service with SnapStart optimization
Globals:
  Function:
    Timeout: 20
    MemorySize: 2048
    Runtime: java21
    Architectures:
    - x86_64
Resources:
  UserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: UserFunction
      Handler: com.example.user.UserHandler::handleRequest
      AutoPublishAlias: live
      SnapStart:
        ApplyOn: PublishedVersions
      Events:
        GetUser:
          Type: Api
          Properties:
            Path: /api/users/{id}
            Method: get
    Metadata:
      SamResourceId: UserFunction
Outputs:
  UserApi:
    Description: API Gateway endpoint URL for User Service
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/api/users/
